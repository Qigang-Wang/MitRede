name: mitrede-prod

x-mitrede-build: &mitrede-build
  context: "${MITREDE_BUILD_CONTEXT:-https://github.com/Qigang-Wang/MitRede.git#main}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mitrede
      POSTGRES_USER: mitrede
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitrede -d mitrede"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      <<: *mitrede-build
      target: api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://mitrede:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/mitrede?schema=public
      STORAGE_PATH: /app/storage
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mitrede.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - storage-data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    init: true
    restart: unless-stopped

  web:
    build:
      <<: *mitrede-build
      target: web
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
